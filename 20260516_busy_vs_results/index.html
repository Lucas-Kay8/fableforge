<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>深渊里的擦镜人 — 勤奋的陷阱</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="composition"
       data-composition-id="composition"
       data-width="1920"
       data-height="1080"
       data-duration="74.88">

    <div class="vignette"></div>

    <audio id="narration"
           src="assets/narration.wav"
           data-start="0"
           data-duration="74.88"
           data-track-index="0">
    </audio>

    <audio id="bgm"
           src="assets/bgm.mp3"
           data-start="0"
           data-duration="74.88"
           data-track-index="-1"
           data-volume="0.25">
    </audio>

    <div id="scenes-container"></div>

  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["composition"] = tl;

    const scenes = [
      { id: "scene1", start: 0, duration: 10.69, subtitle: "在一个永恒黑暗的海岛上，人们唯一赖以生存的，是一种极其精密的……“光能捕获仪”。" },
      { id: "scene2", start: 10.69, duration: 9.46, subtitle: "老木是岛上最勤奋的人。他每天工作 16 个小时，甚至在仪器旁……支起了行军床。" },
      { id: "scene3", start: 20.15, duration: 6.07, subtitle: "他不分昼夜地擦拭捕获仪的外壳，直到它在微光下像镜子一样闪亮。周围的草地，连一粒灰尘……都没有。" },
      { id: "scene4", start: 26.22, duration: 9.72, subtitle: "所有人都感叹：老木太拼了，他是全岛的楷模。领袖深受打动，决定提拔老木为……“首席维护官”。" },
      { id: "scene5", start: 35.94, duration: 7.36, subtitle: "然而，就在授衔的那天……全岛的灯火，瞬间……熄灭了。" },
      { id: "scene6", start: 43.30, duration: 14.16, subtitle: "人们惊恐地拆开仪器才发现：核心的感光元件，早已因为内部漏油而……彻底失效。" },
      { id: "scene7", start: 57.46, duration: 5.42, subtitle: "而老木擦亮的，仅仅是那层与能量获取……毫无关系的……装饰性外壳。" },
      { id: "scene8", start: 62.88, duration: 8.10, subtitle: "组织到底是奖励“结果”，还是奖励“表演”？当你奖励“擦外壳”的人，所有人都会放下扳手，转而去拿抹布。" },
      { id: "scene9", start: 70.98, duration: 3.90, subtitle: "这就是“组织熵增”的起点。低效的勤奋，是对组织资源……最大的浪费。" }
    ];

    const container = document.getElementById("scenes-container");
    scenes.forEach(({ id, start, duration, subtitle }) => {
      const scene = document.createElement("div");
      scene.id = id;
      scene.className = "clip";
      scene.dataset.start = start;
      scene.dataset.duration = duration;
      scene.dataset.trackIndex = "1";

      const bgImg = document.createElement("img");
      bgImg.className = "bg-fill";
      bgImg.src = `assets/${id}.png`;

      const fgImg = document.createElement("img");
      fgImg.className = "fg-main";
      fgImg.src = `assets/${id}.png`;

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const sub = document.createElement("div");
      sub.className = "subtitle";
      sub.textContent = subtitle;
      overlay.appendChild(sub);

      scene.appendChild(bgImg);
      scene.appendChild(fgImg);
      scene.appendChild(overlay);
      container.appendChild(scene);

      // Ken Burns Effect on Foreground Image
      tl.fromTo(fgImg,
        { scale: 1.0 },
        { scale: 1.1, duration: duration, ease: "none" },
        start
      );

      // Subtitle breathe in
      tl.from(overlay, { opacity: 0, y: 15, duration: 0.8, ease: "power2.out" }, start + 0.3);
    });
  </script>
</body>
</html>
