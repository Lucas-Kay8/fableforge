<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼王试炼 - 预览版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --bg: #000; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* 核心画布：适配 16:9 */
        #composition {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .clip {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; display: none;
        }

        /* 背景：模糊铺满，解决全屏感 */
        .bg-fill {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            object-fit: cover;
            filter: blur(40px) brightness(0.4);
            z-index: 1;
        }

        /* 前景：完整显示，解决不完整问题 */
        .fg-main {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 5;
            /* 移除可能导致边界模糊的过大阴影，保持图片边缘清晰 */
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .overlay {
            position: absolute;
            bottom: 12%; width: 100%;
            text-align: center; z-index: 10;
            padding: 0 5%;
        }

        .subtitle {
            font-size: clamp(24px, 4vw, 52px);
            font-weight: 700;
            text-shadow: 0 4px 20px #000;
            opacity: 0; transform: translateY(20px);
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 8; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="composition" data-composition-id="composition" data-width="1920" data-height="1080">
        <div class="vignette"></div>
        <audio id="narration" src="assets/narration.wav" data-start="0" data-duration="60" data-track-index="0"></audio>

        <!-- 场景定义 -->
        <div id="scene1" class="clip" data-start="0" data-duration="5.2">
            <img class="bg-fill" src="assets/scene1.png">
            <img class="fg-main" src="assets/scene1.png">
            <div class="overlay"><div class="subtitle">在这片冰冷的荒野，权力从不属于弱者。</div></div>
        </div>

        <div id="scene2" class="clip" data-start="5.2" data-duration="10.3">
            <img class="bg-fill" src="assets/scene2.png">
            <img class="fg-main" src="assets/scene2.png">
            <div class="overlay"><div class="subtitle">试炼规则：谁带出的猎物最重，谁就是新的王。</div></div>
        </div>

        <div id="scene3" class="clip" data-start="15.5" data-duration="4.3">
            <img class="bg-fill" src="assets/scene3.png">
            <img class="fg-main" src="assets/scene3.png">
            <div class="overlay"><div class="subtitle">每个人都以为，这将是一场史无前例的狩猎狂欢。</div></div>
        </div>

        <div id="scene4" class="clip" data-start="19.8" data-duration="4.3">
            <img class="bg-fill" src="assets/scene4.png">
            <img class="fg-main" src="assets/scene4.png">
            <div class="overlay"><div class="subtitle">第一天是征服的咆哮，第二天却是诡异的死寂。</div></div>
        </div>

        <div id="scene5" class="clip" data-start="24.1" data-duration="6.5">
            <img class="bg-fill" src="assets/scene5.png">
            <img class="fg-main" src="assets/scene5.png">
            <div class="overlay"><div class="subtitle">第三天，它毫发无伤地走了出来，带着堆积如山的战利品。</div></div>
        </div>

        <div id="scene6" class="clip" data-start="30.6" data-duration="5.0">
            <img class="bg-fill" src="assets/scene6.png">
            <img class="fg-main" src="assets/scene6.png">
            <div class="overlay"><div class="subtitle">老狼王大喜：这一定是史上最高效、最完美的猎手。</div></div>
        </div>

        <div id="scene7" class="clip" data-start="35.6" data-duration="7.2">
            <img class="bg-fill" src="assets/scene7.png">
            <img class="fg-main" src="assets/scene7.png">
            <div class="overlay"><div class="subtitle">它根本没有狩猎。它只是在出口，咬断了每个同伴的喉咙。</div></div>
        </div>

        <div id="scene8" class="clip" data-start="42.8" data-duration="4.6">
            <img class="bg-fill" src="assets/scene8.png">
            <img class="fg-main" src="assets/scene8.png">
            <div class="overlay"><div class="subtitle">当指标变成目标，聪明人就会发现：绊倒对手比提升自己更容易。</div></div>
        </div>

        <div id="scene9" class="clip" data-start="47.4" data-duration="7.4">
            <img class="bg-fill" src="assets/scene9.png">
            <img class="fg-main" src="assets/scene9.png">
            <div class="overlay"><div class="subtitle">博弈模型证明：破坏对手成本 &lt; 提升自我成本。</div></div>
        </div>

        <div id="scene10" class="clip" data-start="54.8" data-duration="5.2">
            <img class="bg-fill" src="assets/scene10.png">
            <img class="fg-main" src="assets/scene10.png">
            <div class="overlay"><div class="subtitle">你以为选出了战将，其实你只选出了残杀队友的屠夫。</div></div>
        </div>
    </div>

    <script>
        const tl = gsap.timeline({ paused: true });
        
        // 提前注册到 HyperFrames 渲染引擎，防止后续逻辑报错导致整个时间轴丢失
        window.__timelines = window.__timelines || {};
        window.__timelines["composition"] = tl;

        function setupScene(sceneId) {
            const el = document.querySelector(sceneId);
            if (!el) return;
            const start = parseFloat(el.dataset.start);
            const duration = parseFloat(el.dataset.duration);
            const fg = el.querySelector('.fg-main');
            const sub = el.querySelector('.subtitle');

            tl.set(el, { display: "block" }, start);
            tl.to(el, { opacity: 1, duration: 0.6 }, start);
            
            if (fg) {
                // 此时 img 元素已经铺满全屏，直接进行整体缩放，利用 transform-origin: center 自然居中
                tl.fromTo(fg, { scale: 1.1 }, { scale: 1.0, duration: duration, ease: "power1.inOut" }, start);
            }
            if (sub) {
                tl.to(sub, { opacity: 1, y: 0, duration: 0.8 }, start + 1.2);
            }

            tl.to(el, { opacity: 0, duration: 0.6 }, start + duration - 0.6);
            tl.set(el, { display: "none" }, start + duration);
        }

        // 统一所有场景的注册逻辑，确保图片数量和顺序严格一致
        ["#scene1", "#scene2", "#scene3", "#scene4", "#scene5", "#scene6", "#scene7", "#scene8", "#scene9", "#scene10"].forEach(setupScene);
    </script>
</body>
</html>
