<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>不会燃烧的灯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="composition"
       data-composition-id="composition"
       data-width="1080"
       data-height="1920"
       data-duration="109.34">

    <div class="vignette"></div>

    <audio id="narration"
           src="assets/narration.wav"
           data-start="0"
           data-duration="109.34"
           data-track-index="0">
    </audio>

    <audio id="bgm"
           src="assets/bgm.mp3"
           data-start="0"
           data-duration="109.34"
           data-track-index="-1"
           data-volume="0.2">
    </audio>

    <div id="scenes-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["composition"] = tl;

    // 经过“静音中点切分法”重校后的精确时间轴
    const scenes = [
      { id: "scene_cover", start: 0, duration: 1.43, subtitle: "不会燃烧的灯" },
      { id: "scene1", start: 1.43, duration: 19.84, subtitle: "山里有一座寺，寺里有一盏奇怪的灯。它不照亮整间屋子，只照亮脚前一小块地。小沙弥明远不懂：既然是最重要的灯，为什么不能亮一点？" },
      { id: "scene2", start: 21.27, duration: 18.23, subtitle: "富商带着西域明珠赶来，他说：亮才有用。可当山中起雾，明珠的光把雾气照得一片惨白，白茫茫中，他反而看不清路了。" },
      { id: "scene3", start: 39.50, duration: 14.86, subtitle: "明远重新提起旧灯。那点微光虽然只照脚前，却让他们一步步走出了迷雾。富商沉默了：原来光太强也会变成遮蔽。" },
      { id: "scene4", start: 54.36, duration: 17.77, subtitle: "将军想在灯上刻下戒律，命令人心不得有贪嗔。可半夜里，他满头大汗地醒来：他发现越命令自己放下，那些仇恨和恐惧反而越响亮。" },
      { id: "scene5", start: 72.13, duration: 12.72, subtitle: "灯只是静静亮着，没有审判，也没有命令。将军看着火苗忽然哭了：原来我一直在命令自己，假装没有仇恨。" },
      { id: "scene6", start: 84.85, duration: 12.08, subtitle: "读书人拆开了灯，想寻找神迹。他发现油、芯、盏全都是寻常物，大失所望。可当他要下山走夜路时才惊觉：他研究了半天道理，却忘了借它看路。" },
      { id: "scene7", start: 96.93, duration: 8.09, subtitle: "师父圆寂前说：明珠想照亮一切，连雾也照亮了；戒律想管住人心，连痛苦也压住了；解释想拆开真相，连用处也拆散了。" },
      { id: "scene8", start: 105.02, duration: 3.30, subtitle: "这盏灯不替你看路，也不命令你。它只让你在这一刻，看见自己正站在哪里。" },
      { id: "scene_end", start: 108.32, duration: 1.02, subtitle: "修行不是获得更亮的答案，而是培养一种不被答案遮蔽的看见。" }
    ];

    const container = document.getElementById("scenes-container");
    scenes.forEach(({ id, start, duration, subtitle }, index) => {
      const scene = document.createElement("div");
      scene.id = id;
      scene.className = "clip";
      scene.dataset.start = start;
      scene.dataset.duration = duration;
      scene.dataset.trackIndex = "1";
      
      // 显式设置递增 z-index，确保后一幕物理上覆盖前一幕
      scene.style.zIndex = index + 1;

      const bgImg = document.createElement("img");
      bgImg.className = "bg-fill";
      bgImg.src = `assets/${id}.png`;

      const fgImg = document.createElement("img");
      fgImg.className = "fg-main";
      fgImg.src = `assets/${id}.png`;

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const sub = document.createElement("div");
      sub.className = "subtitle";
      sub.textContent = subtitle;
      overlay.appendChild(sub);

      scene.appendChild(bgImg);
      scene.appendChild(fgImg);
      scene.appendChild(overlay);
      container.appendChild(scene);

      // --- 核心修复：严谨的可见性生命周期管理 ---
      
      // 1. 场景激活：瞬间设为可见，并确保 opacity 为 1
      tl.set(scene, { autoAlpha: 1 }, start);
      
      // 2. 场景进入动画：显式从 0 变到 1 (fromTo 解决 CSS 初始值冲突)
      if (index > 0) {
        tl.fromTo(scene, 
          { opacity: 0 }, 
          { opacity: 1, duration: 0.5, ease: "none" }, 
          start
        );
      } else {
        // 第一幕强制设为不透明
        tl.set(scene, { opacity: 1 }, start);
      }

      // 3. Ken Burns 缩放动画
      tl.fromTo(fgImg,
        { scale: 1.0, transformOrigin: "center center" },
        { scale: 1.08, duration: duration, ease: "none" },
        start
      );

      // 4. 字幕出现
      tl.from(sub,
        { opacity: 0, y: 15, duration: 0.6, ease: "back.out(1.2)" },
        start + 0.3
      );

      // 5. 场景清理：在下一幕开始时或本幕结束时，彻底隐藏自己
      // 这样可以释放渲染资源，并防止层级穿透
      if (index < scenes.length - 1) {
        const nextStart = scenes[index + 1].start;
        tl.set(scene, { autoAlpha: 0 }, nextStart);
      }
    });
  </script>
</body>
</html>
