<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>不会燃烧的灯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="composition"
       data-composition-id="composition"
       data-width="1080"
       data-height="1920"
       data-duration="230.14">

    <div class="vignette"></div>

    <audio id="narration"
           src="assets/narration_v2.wav"
           data-start="0"
           data-duration="230.14"
           data-track-index="0">
    </audio>

    <audio id="bgm"
           src="assets/bgm.mp3"
           data-start="0"
           data-duration="230.14"
           data-track-index="-1"
           data-volume="0.2">
    </audio>

    <div id="scenes-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["composition"] = tl;

    // V2 完整叙事版：18 幕，时间轴按字数比例分配（总 230.14s）
    const scenes = [
      { id: "scene_cover", start: 0.0, duration: 1.7, subtitle: "不会燃烧的灯" },
      { id: "scene1", start: 1.7, duration: 15.2, subtitle: "山里有一座寺，寺里有一盏灯。这盏灯很怪——不管夜里风多大、雨多急，它都不会灭。它从来不照亮整间屋子，只照亮来人脚前的一小块地" },
      { id: "scene2", start: 16.8, duration: 17.8, subtitle: "寺里有个小沙弥叫明远，每天负责添油、剪芯、擦灯盏。师父说这盏灯是寺里最重要的东西。明远不懂——既然最重要，为什么不做大一点" },
      { id: "scene3", start: 34.6, duration: 14.7, subtitle: "有一天山下来了一个富商。他愿捐一千两银子，换黄金灯座配八面铜镜。明远很高兴，觉得寺终于要气派了" },
      { id: "scene4", start: 49.3, duration: 13.2, subtitle: "师父却摇了头。富商不服：修行人不就是要破除黑暗吗？灯越亮不是功德越大？师父没回答，只让明远带富商住一晚" },
      { id: "scene5", start: 62.5, duration: 16.1, subtitle: "那天夜里山中起了大雾。富商掏出明珠——方圆十丈全被照亮了。可雾气也被照亮了，白茫茫一片，他走了三步就被石头绊倒了" },
      { id: "scene6", start: 78.6, duration: 16.6, subtitle: "明远收起明珠，提起旧灯。那点微光只照脚前三尺，可就是这三尺，让他们看清了每一块石头。他们一步一步走出了迷雾" },
      { id: "scene7", start: 95.2, duration: 8.7, subtitle: "到了寺门口，富商站住了很久没说话。最后他轻声说：原来光太强也会变成遮蔽" },
      { id: "scene8", start: 103.9, duration: 15.2, subtitle: "后来又来了一位将军。他带了刻刀想在灯座上刻下戒律——命令人心不得有贪嗔恐惧。他说只要时时看见戒律心就不会乱" },
      { id: "scene9", start: 119.0, duration: 13.9, subtitle: "可半夜将军满头大汗地醒来。越命令自己放下仇恨，血和哭声反而越响亮。越说不准恐惧，身体就越颤抖" },
      { id: "scene10", start: 133.0, duration: 13.7, subtitle: "他走到灯前，灯只是静静亮着。没有审判也没有命令。将军看着火苗忽然哭了——原来我一直在命令自己假装没有仇恨" },
      { id: "scene11", start: 146.7, duration: 13.7, subtitle: "最后来了一个读书人。他不拜灯也不求灯——他把灯拆开了。想找到灯的秘密：特殊的油？罕见的灯芯？还是什么机关" },
      { id: "scene12", start: 160.4, duration: 12.3, subtitle: "他研究了三天。油是普通菜油，芯是普通棉线，盏是普通青铜。什么都是寻常物，他大失所望准备下山" },
      { id: "scene13", start: 172.7, duration: 11.1, subtitle: "可走到山门口天已经黑了。他一脚踩空差点摔下石阶——研究了三天道理，却忘了一件事：借它看路" },
      { id: "scene14", start: 183.7, duration: 10.3, subtitle: "许多年后师父要圆寂了。明远跪在床前问：这盏灯到底有什么秘密？师父看着他笑了一下说——" },
      { id: "scene15", start: 194.1, duration: 18.5, subtitle: "明珠想照亮一切连雾也照亮了。戒律想管住人心连痛苦也压住了。解释想拆开真相连用处也拆散了。所以读书人什么都懂了却忘了走路" },
      { id: "scene16", start: 212.6, duration: 10.8, subtitle: "这盏灯不替你看路，也不命令你，也不解释自己。它只做一件事——让你在这一刻看见自己正站在哪里" },
      { id: "scene_end", start: 223.4, duration: 6.7, subtitle: "修行不是获得更亮的答案，而是培养一种不被答案遮蔽的看见" }
    ];

    const container = document.getElementById("scenes-container");
    scenes.forEach(({ id, start, duration, subtitle }, index) => {
      const scene = document.createElement("div");
      scene.id = id;
      scene.className = "clip";
      scene.dataset.start = start;
      scene.dataset.duration = duration;
      scene.dataset.trackIndex = "1";
      scene.style.zIndex = index + 1;

      const bgImg = document.createElement("img");
      bgImg.className = "bg-fill";
      bgImg.src = `assets/${id}.png`;

      const fgImg = document.createElement("img");
      fgImg.className = "fg-main";
      fgImg.src = `assets/${id}.png`;

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const sub = document.createElement("div");
      sub.className = "subtitle";
      sub.textContent = subtitle;
      overlay.appendChild(sub);

      scene.appendChild(bgImg);
      scene.appendChild(fgImg);
      scene.appendChild(overlay);
      container.appendChild(scene);

      // 场景激活
      tl.set(scene, { autoAlpha: 1 }, start);
      
      // 场景进入：fromTo 防止 CSS 初始值冲突
      if (index > 0) {
        tl.fromTo(scene, 
          { opacity: 0 }, 
          { opacity: 1, duration: 0.5, ease: "none" }, 
          start
        );
      } else {
        tl.set(scene, { opacity: 1 }, start);
      }

      // Ken Burns 缩放
      tl.fromTo(fgImg,
        { scale: 1.0, transformOrigin: "center center" },
        { scale: 1.08, duration: duration, ease: "none" },
        start
      );

      // 字幕出现
      tl.from(sub,
        { opacity: 0, y: 15, duration: 0.6, ease: "back.out(1.2)" },
        start + 0.3
      );

      // 场景清理
      if (index < scenes.length - 1) {
        const nextStart = scenes[index + 1].start;
        tl.set(scene, { autoAlpha: 0 }, nextStart + 0.5);
      }
    });
  </script>
</body>
</html>
