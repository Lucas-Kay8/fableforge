<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>心理学寓言：红色的诅咒</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        #composition { position: relative; overflow: hidden; background: #000; width: 1920px; height: 1080px; }
        
        .clip { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .clip.active { opacity: 1; }

        .fg-main { width: 100%; height: 100%; object-fit: contain; transform-origin: center center; }

        .subtitle {
            position: absolute;
            bottom: 8%;
            width: 80%;
            text-align: center;
            color: #fff;
            font-size: 42px;
            font-weight: 500;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
            line-height: 1.5;
            letter-spacing: 2px;
            z-index: 10;
            padding: 0 40px;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="composition" 
     data-composition-id="composition" 
     data-width="1920" 
     data-height="1080"
     data-start="0"
     data-duration="92.58">
    <audio id="narration" src="assets/narration.wav" data-start="0" data-duration="92.58" data-track-index="0"></audio>
    <div id="scenes-container"></div>
</div>

<script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["composition"] = tl;

    const sceneData = [
      { id: "scene1", start: 0, duration: 10.88, subtitle: "海浪拍打着礁石，像是某种迟缓的、巨大的呼吸。风暴刚刚熄灭，留下一地破碎的残骸。" },
      { id: "scene2", start: 10.98, duration: 12.32, subtitle: "幸存者们围坐在火堆旁。火光映照着每一张苍白、惊恐的脸。谁也没有开口，空气里只有牙齿打颤的声音。" },
      { id: "scene3", start: 23.4, duration: 10.72, subtitle: "角落里，那个被鲨鱼咬断腿的同伴正虚弱地喘息。他的伤口在月光下呈现出一种诡异的、浓稠的黑色。" },
      { id: "scene4", start: 34.22, duration: 11.04, subtitle: "人群中，有人抬起了头。恐惧开始发酵，它需要一个出口，一个解释，来证明为什么倒霉的……不是自己。" },
      { id: "scene5", start: 45.36, duration: 6.08, subtitle: "那个男人指着伤员领口露出的一角红布。他的声音在颤抖，却带着一种发现真理般的……亢奋。" },
      { id: "scene6", start: 51.54, duration: 9.28, subtitle: "“是因为你带了红布！”他吼叫着。“鲨鱼是因为那抹红色才来的！是你……害了大家！”" },
      { id: "scene7", start: 60.92, duration: 10.72, subtitle: "一瞬间，逻辑消失了。所有人都在疯狂地点头，仿佛只要烧掉那块红布，大海就会变得温顺。" },
      { id: "scene8", start: 71.74, duration: 10.08, subtitle: "那个虚弱的人被推到了黑暗里。没有人去加固漏水的木船。他们只是死死盯着那团红色的灰烬。" },
      { id: "scene9", start: 81.92, duration: 6.4, subtitle: "这种荒诞……并不只发生在荒岛。" },
      { id: "scene10", start: 88.42, duration: 4.16, subtitle: "指责受害者，是为了欺骗自己。只要我穿得对，坏事……永远不会降临。" }
    ];

    const container = document.getElementById("scenes-container");

    sceneData.forEach((data) => {
        const clip = document.createElement("div");
        clip.id = data.id;
        clip.className = "clip";
        clip.dataset.trackIndex = "1";
        clip.dataset.start = data.start;
        clip.dataset.duration = data.duration;

        const img = document.createElement("img");
        img.className = "fg-main";
        img.src = `assets/${data.id}.png`;
        clip.appendChild(img);

        const overlay = document.createElement("div");
        overlay.className = "overlay-bottom";
        clip.appendChild(overlay);

        const sub = document.createElement("div");
        sub.className = "subtitle";
        sub.textContent = data.subtitle;
        clip.appendChild(sub);

        container.appendChild(clip);

        // --- 修复点：场景可见性切换 ---
        tl.set(clip, { opacity: 1 }, data.start);
        tl.set(clip, { opacity: 0 }, data.start + data.duration);

        // GSAP Ken Burns 动画集成
        tl.fromTo(img, 
            { scale: 1.0 }, 
            { scale: 1.08, duration: data.duration, ease: "none" }, 
            data.start
        );
    });
</script>

</body>
</html>
